<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML &amp; CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML &amp; CSS Quiz</h1>

    <form action="#" method="get">
        <p>
            <label for="q1">1. Which HTML element is used to define the main heading of a page?</label>
            <input type="text" name="q1" id="q1">
        </p>

        <p>
            <label for="q2">2. In your own words, explain the difference between an id and a class attribute.</label>
            <textarea name="q2" id="q2" rows="4" cols="40"></textarea>
        </p>

        <p>
            <label for="q3">3. Which CSS property is used to change the text color of an element?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="color">color</option>
                <option value="background-color">background-color</option>
                <option value="font-color">font-color</option>
                <option value="text-style">text-style</option>
            </select>
        </p>

        <p>
            <label for="q4">4. How many heading levels are available in HTML (h1 through h?)?</label>
            <input type="number" name="q4" id="q4" min="1" max="10">
        </p>

        <p>
            <button type="submit">Submit Quiz</button>
        </p>
    </form>
</body>

</html>
