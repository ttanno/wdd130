<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description"
      content="Contact Splash Wild White Rafting in Peru. Find our address, phone, email, and send us a message about trips, reservations, or the website.">
    <meta name="author" content="Alesandro Felix">
    <title>White Water Rafting Co. | Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Splash Wild White Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="contact-info">
            <address>
                Av. El Sol 123<br>
                Cusco, Perú<br>
                +51 984 123 456<br>
                <a href="mailto:info@splashwildrafting.com">info@splashwildrafting.com</a>
            </address>
        </section>

        <section class="contact-main">
            <div class="map-wrapper">
                <iframe
                  src="https://maps.google.com/maps?q=Cusco%2C%20Peru&t=&z=13&ie=UTF8&iq&output=embed"
                  title="Map showing Splash Wild White Rafting location in Cusco, Peru"
                  loading="lazy"></iframe>
            </div>

            <form action="#" method="get" class="contact-form">
                <p>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Your full name" required>
                </p>

                <p>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="you@example.com" required>
                </p>

                <fieldset class="purpose">
                    <legend>Message Purpose</legend>
                    <p>
                        <input type="radio" name="purpose" id="general" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </p>
                    <p>
                        <input type="radio" name="purpose" id="reservation" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </p>
                    <p>
                        <input type="radio" name="purpose" id="suggestion" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </p>
                </fieldset>

                <p>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="5" placeholder="Type here" required></textarea>
                </p>

                <p class="newsletter">
                    <input type="checkbox" name="newsletter" id="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </p>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/man1.jpg" alt="Portrait of Diego Torres, Head Rafting Guide">
                    <figcaption>Diego Torres<br>Head Rafting Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/girl1.jpg" alt="Portrait of Maria Alvarez, Trip Coordinator">
                    <figcaption>Maria Alvarez<br>Trip Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/girl2.jpg" alt="Portrait of Lucia Ramos, Safety Officer">
                    <figcaption>Lucia Ramos<br>Safety Officer</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 Splash Wild White Rafting, Alessandro Felix</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://twitter.com/">
                <img src="images/x_twitter.svg" alt="X (Twitter) Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
